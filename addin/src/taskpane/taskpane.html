<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LEONA 자동견적</title>

    <!-- Office JavaScript API: Outlook과 대화하는 공식 라이브러리 -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <header class="header">
        <h1>LEONA 자동견적</h1>
        <p>선택한 메일 정보</p>
    </header>

    <!-- Outlook 밖(일반 브라우저)에서 열었을 때만 보이는 안내 -->
    <section id="sideload-msg" class="main">
        <p>이 페이지는 Outlook에 추가 기능으로 설치(사이드로드)한 뒤 메일을 선택해야 동작합니다.</p>
    </section>

    <main id="app-body" class="main" style="display: none;">
        <p id="status" class="status" hidden></p>

        <dl class="fields">
            <dt>제목</dt>
            <dd id="subject">-</dd>

            <dt>발신자</dt>
            <dd id="from">-</dd>

            <dt>수신 시각</dt>
            <dd id="received-at">-</dd>

            <dt>본문 앞부분</dt>
            <dd id="body-preview" class="preview">-</dd>

            <dt>conversationId</dt>
            <dd id="conversation-id" class="mono">-</dd>

            <dt>internetMessageId</dt>
            <dd id="internet-message-id" class="mono">-</dd>
        </dl>

        <details class="json">
            <summary>메일 표준 JSON 보기</summary>
            <pre id="snapshot-json"></pre>
        </details>
    </main>
</body>

</html>
