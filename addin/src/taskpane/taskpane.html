<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LEONA 자동견적</title>

    <!-- Office JavaScript API: Outlook과 대화하는 공식 라이브러리 -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <header class="header">
        <h1>LEONA 자동견적</h1>
        <p>선택한 메일 정보</p>
    </header>

    <!-- Outlook 밖(일반 브라우저)에서 열었을 때만 보이는 안내 -->
    <section id="sideload-msg" class="main">
        <p>이 페이지는 Outlook에 추가 기능으로 설치(사이드로드)한 뒤 메일을 선택해야 동작합니다.</p>
    </section>

    <main id="app-body" class="main" style="display: none;">
        <p id="status" class="status" hidden></p>

        <!-- 케이스 등록 상태와 [케이스 생성] 버튼 (FR-101) -->
        <section class="card">
            <p id="case-state" class="case-state"></p>
            <button id="create-case" class="button button--primary" hidden>케이스 생성</button>
        </section>

        <!-- 담당자가 보낸 [케이스ID] 메일: 발송 시각·수행자 기록 (FR-505) -->
        <section id="sent-section" class="card" hidden>
            <p id="sent-state"></p>
            <button id="record-sent" class="button button--primary">발송 기록</button>
        </section>

        <!-- 초안 만들기 (FR-304·505): Outlook 작성 창을 띄우기만 하고, 발송은 담당자가 직접 한다 -->
        <section id="draft-section" class="card" hidden>
            <h2>메일 초안</h2>
            <label for="questions" class="label">보완 요청 문항 (한 줄에 하나 · C트랙 검증 연결 전 임시 입력)</label>
            <textarea id="questions" rows="4" placeholder="예) 선적항(POL)을 알려 주세요."></textarea>
            <div class="buttons">
                <button id="supplement-draft" class="button">보완 요청 초안 열기</button>
                <button id="quote-draft" class="button">견적서 송부 초안 열기</button>
            </div>
        </section>

        <!-- 회신 연결 (FR-104): 자동 후보 → 담당자가 골라 병합, 후보가 없으면 직접 선택 -->
        <section id="reply-section" class="card" hidden>
            <h2>회신으로 병합</h2>
            <ul id="reply-candidates" class="candidates"></ul>
            <details id="manual-select">
                <summary>케이스 직접 선택</summary>
                <select id="case-select"></select>
                <button id="merge-selected" class="button">선택한 케이스에 병합</button>
            </details>
        </section>

        <dl class="fields">
            <dt>제목</dt>
            <dd id="subject">-</dd>

            <dt>발신자</dt>
            <dd id="from">-</dd>

            <dt>수신 시각</dt>
            <dd id="received-at">-</dd>

            <dt>본문 앞부분</dt>
            <dd id="body-preview" class="preview">-</dd>

            <dt>conversationId</dt>
            <dd id="conversation-id" class="mono">-</dd>

            <dt>internetMessageId</dt>
            <dd id="internet-message-id" class="mono">-</dd>
        </dl>

        <details class="json">
            <summary>메일 표준 JSON 보기</summary>
            <pre id="snapshot-json"></pre>
        </details>
    </main>
</body>

</html>
